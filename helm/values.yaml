imageRepository: &imageRepository "acrarolibotnonprod.azurecr.io/automation/locust-automation:v3.1.5"

global:
  name: locust-global
  test_file: wcs_get_coverage.py
  test_file_path: "/mnt/locust/tests/DEM"
  host: /

  env: {
      BASE_URL: "https://dem-geoserver-pp-geoserver-nginx-route-qa.apps.j1lk3njp.eastus.aroapp.io//wcs",
      VERSION: "2.0.1",
      COVERAGE_ID: "dtm_srtm30wgs84geo_untiled",
      BBOX_WIDTH: 500,
      BBOX_HEIGHT: 500,
      SCALE_SIZE: "(250,250)",
      FORMAT: "image/tiff",
#      BBOX: "[34.800000000,32.200000000,34.8694444447,32.2694444449]",
      OUTPUT_CRS: "utm",
      CRS_DICT: '{"utm":"http://www.opengis.net/def/crs/EPSG/0/32636", "geo":"http://www.opengis.net/def/crs/EPSG/0/4326"}',
      SCALE_FACTOR: "2"
      }
  env_secret: true
  env_external_secret:
    {}
  secret_name_api_key_locust: "dem-secret"
  sub_url_secret: "dem-secret"
  headless: false

image:
  repository: *imageRepository
  tag: 1.2.0
  pullPolicy: Always

service:
  type: ClusterIP
  # type: NodePort
  annotations: {}

master:
  image: *imageRepository
  logLevel: INFO
  envs_include_default: true
  env: {}
  args: []
  pvc:
    enabled: true
  strategy:
    type: RollingUpdate
  auth:
    enabled: false
    username: "danny"
    password: "danny"
  csv_options:
    enabled: false
    csv: "/home/kaka/dam/"
    csv_history: false
  restartPolicy: Always

worker:
  image: *imageRepository
  logLevel: INFO
  envs_include_default: true
  replicas: 2
  env: { SUB_URL_FOR_IDS: "https://www.google.com" }
  args: []
  pvc:
    enabled: true
  strategy:
    type: RollingUpdate
  restartPolicy: Always

nameOverride: ""
fullnameOverride: "locust"
pullSecretName: mapcolonies-secret

ingress:
 enabled: false
 className: ""
 annotations: {}
  #  kubernetes.io/ingress.class: nginx
  #  kubernetes.io/tls-acme: "true"
 hosts:
   - host: chart-example.local
     pathType: ImplementationSpecific
     path: /
# tls: []
#  - secretName: chart-example-tls
#    hosts:
#      - chart-example.local

route:
  enabled: true
  path: /
  https: true
  timeout:
    enabled: false # defaults to 30s by openshift
    duration: 60s # supported units (us, ms, s, m, h, d)
#ingress:
#  enabled: false
#  type: "nginx-kubernetes" # supported values: "nginx-org" | "nginx-kubernetes"
#  path: /locust-ww
#  host: "lb-mapcolonies.gg.wwest.local"
#  cors:
#    enabled: true
#    origin: "*"
#    tls: []

storage:
  enabled: true
  pvcName: internal-pvc-nfs
  volumeName: ingestion-storage
  mountPathName: /layerSources
  subPath: ingestion-source

volumeMounts:
  - name: test-files-volume
    mountPath: /mnt/locust/test_files